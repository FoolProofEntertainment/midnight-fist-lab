<style>
/* MFL cleanup + roster affordance — 2026-09-29. Scoped to the MFL page. */
/* 1. Hide the dev-only Arena Walk Test section (public page should not show it). */
#arena-walk-test { display: none !important; }

/* 2. Roster scroll affordance: bottom fade while more fighters are below. */
#roster-grid { --mfl-roster-fade: 1; }
#roster-grid.mfl-at-bottom { --mfl-roster-fade: 0; }
#roster-grid {
  -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 34px * var(--mfl-roster-fade)), transparent 100%);
  mask-image: linear-gradient(to bottom, #000 calc(100% - 34px * var(--mfl-roster-fade)), transparent 100%;
}
</style>
<script>
/* Toggles the roster fade: visible only while more fighters sit below the fold. */
(function () {
  function hook() {
    var g = document.getElementById('roster-grid');
    if (!g || g.__mflFadeHooked) return;
    g.__mflFadeHooked = true;
    var upd = function () {
      var more = g.scrollHeight - g.scrollTop - g.clientHeight > 8;
      g.classList.toggle('mfl-at-bottom', !more);
    };
    g.addEventListener('scroll', upd, { passive: true });
    if ('MutationObserver' in window) new MutationObserver(upd).observe(g, { childList: true });
    window.addEventListener('resize', upd);
    upd();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', hook);
  else hook();
  setTimeout(hook, 2500); /* late safety: roster renders after boot */
})();
</script>
